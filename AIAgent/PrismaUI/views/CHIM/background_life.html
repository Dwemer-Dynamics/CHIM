<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Life</title>
    <link rel="stylesheet" href="background_life.css">
</head>
<body data-chim-menu-scale-target="#background-life-modal">
    <div id="background-life-modal" class="modal-container">
        <header class="modal-header">
            <div>
                <h1>Background Life</h1>
                <p>Recent NPC activity across Skyrim</p>
            </div>
            <div class="header-actions">
                <button class="icon-button rumor-button" type="button" onclick="openRumorModal()">Create Rumor</button>
                <button class="icon-button" id="refresh-button" type="button" title="Refresh activity">Refresh</button>
                <button class="close-button" type="button" onclick="closePanel()" aria-label="Close">X</button>
            </div>
        </header>

        <section class="management-panel" aria-label="Background Life controls">
            <div class="management-card target-card">
                <div class="section-heading">
                    <span>Current Target</span>
                    <span id="target-state-badge" class="state-badge">No target</span>
                </div>
                <div id="target-name" class="target-name">Look at an NPC to manage Background Life.</div>
                <div id="target-refid" class="target-refid">RefID unavailable</div>
                <button id="enrollment-button" class="control-button primary" type="button" disabled>
                    Add to Background Life
                </button>
                <div id="target-status" class="target-status" aria-live="polite"></div>
            </div>

            <div class="management-card">
                <div class="section-heading"><span>NPC Settings</span></div>
                <label class="toggle-row">
                    <span>Auto Actions</span>
                    <input id="auto-actions-toggle" type="checkbox" disabled>
                </label>
                <label class="toggle-row">
                    <span>Send Letters</span>
                    <input id="send-letters-toggle" type="checkbox" disabled>
                </label>
                <label class="toggle-row">
                    <span>Hourly Tracking</span>
                    <input id="hourly-tracking-toggle" type="checkbox" disabled>
                </label>
            </div>

            <div class="management-card">
                <div class="section-heading"><span>Immediate Actions</span></div>
                <div class="button-stack">
                    <button id="trigger-action-button" class="control-button" type="button" disabled>Trigger Action</button>
                    <button id="request-letter-button" class="control-button" type="button" disabled>Request Letter</button>
                </div>
            </div>

            <div class="management-card">
                <div class="section-heading"><span>Inject Context</span></div>
                <div class="button-stack">
                    <button class="control-button context-button" data-mode="mode_inject_log" type="button">Inject Event</button>
                    <button class="control-button context-button" data-mode="mode_inject_chat" type="button">Inject &amp; Chat</button>
                    <button class="control-button context-button" data-mode="mode_director" type="button">Direct Instruction</button>
                </div>
            </div>
        </section>

        <section class="toolbar">
            <label>
                <span>NPC</span>
                <select id="npc-filter">
                    <option value="">All NPCs</option>
                </select>
            </label>
            <label class="search-field">
                <span>Search</span>
                <input id="search-input" type="search" placeholder="Search activity">
            </label>
            <label>
                <span>Rows</span>
                <select id="limit-select">
                    <option value="25">25</option>
                    <option value="50" selected>50</option>
                    <option value="100">100</option>
                </select>
            </label>
        </section>

        <main class="activity-container">
            <div class="panel-status" id="panel-status" aria-live="polite">Loading activity...</div>
            <div class="activity-list" id="activity-list"></div>
        </main>

        <footer class="panel-footer">
            <button class="page-button" id="previous-button" type="button">Previous</button>
            <span id="page-label">Page 1 of 1</span>
            <button class="page-button" id="next-button" type="button">Next</button>
        </footer>

        <div id="rumor-modal-overlay" class="rumor-modal-overlay hidden" aria-hidden="true" onclick="if (event.target === this) closeRumorModal()">
            <div class="rumor-modal-panel" role="dialog" aria-modal="true" aria-labelledby="rumor-modal-title">
                <div class="rumor-modal-header">
                    <div>
                        <h2 id="rumor-modal-title">Create Rumor</h2>
                        <p>Add a rumor directly to Background Life.</p>
                    </div>
                    <button class="rumor-modal-close" type="button" onclick="closeRumorModal()" aria-label="Close create rumor modal">&times;</button>
                </div>
                <form id="rumor-create-form" class="rumor-form" onsubmit="submitRumorForm(event)">
                    <div class="rumor-form-row">
                        <label class="rumor-field">
                            <span>Hold</span>
                            <select id="rumor-hold-select" name="rumor_hold" required>
                                <option value="">Select hold</option>
                                <option value="Skyrim">Skyrim</option>
                                <option value="Whiterun">Whiterun</option>
                                <option value="Eastmarch">Eastmarch</option>
                                <option value="Haafingar">Haafingar</option>
                                <option value="The Reach">The Reach</option>
                                <option value="Hjaalmarch">Hjaalmarch</option>
                                <option value="The Pale">The Pale</option>
                                <option value="Falkreath">Falkreath</option>
                                <option value="The Rift">The Rift</option>
                                <option value="Winterhold">Winterhold</option>
                                <option value="Solstheim">Solstheim</option>
                            </select>
                        </label>
                        <label class="rumor-field">
                            <span>Type</span>
                            <input id="rumor-type-input" name="rumor_type" type="text" placeholder="General">
                        </label>
                        <label class="rumor-field">
                            <span>Length (Days)</span>
                            <input id="rumor-length-days-input" name="rumor_length_days" type="number" min="1" step="1" value="7">
                        </label>
                    </div>
                    <label class="rumor-field">
                        <span>Content</span>
                        <textarea id="rumor-content-input" name="rumor_content" rows="5" required placeholder="Write the rumor text here..."></textarea>
                    </label>
                    <div id="rumor-form-status" class="rumor-form-status" aria-live="polite"></div>
                    <div class="rumor-form-actions">
                        <button class="page-button rumor-cancel-button" type="button" onclick="closeRumorModal()">Cancel</button>
                        <button id="rumor-submit-button" class="icon-button" type="submit">Create Rumor</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="ui_scale.js"></script>
    <script src="background_life.js"></script>
</body>
</html>
