<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>CHIM Interact</title>
    <link rel="stylesheet" href="chatbox.css">
    <link rel="stylesheet" href="item_interaction.css">
</head>
<body data-chim-menu-scale-target=".interaction-panel">
    <div class="focus-chatbox-modal">
        <div class="focus-chatbox-backdrop"></div>
        <main class="focus-chatbox-panel interaction-panel" role="dialog" aria-modal="true" aria-labelledby="title">
            <header class="focus-chatbox-header">
                <h1 id="title">CHIM Interact</h1>
                <button id="close" class="focus-btn focus-btn-close" type="button" aria-label="Close interaction">&times;</button>
            </header>
            <div class="interaction-body">
                <p class="target-line"><span class="field-caption">Target</span><strong id="target"></strong></p>
                <form id="interaction" novalidate>
                    <div class="item-summary">
                        <span class="field-caption">Item</span><span id="selected-item">No item</span>
                        <button id="clear-item" class="focus-btn focus-btn-compact" type="button" aria-label="Clear selected item" hidden>&times;</button>
                        <button id="choose" class="focus-btn focus-btn-compact" type="button" aria-expanded="false" aria-controls="picker">Choose&hellip;</button>
                        <label id="amount-field" hidden>Amount <input id="quantity" type="number" min="1" max="100" value="1" disabled></label>
                    </div>
                    <section id="picker" aria-label="Choose an inventory item" hidden>
                        <label class="visually-hidden" for="search">Search inventory</label>
                        <input id="search" type="search" placeholder="Search inventory">
                        <div id="items" role="group" aria-label="Inventory items"></div>
                    </section>
                    <label class="intent-label" for="intent">What do you want to do?</label>
                    <textarea class="focus-chatbox-input" id="intent" maxlength="1000" rows="4" placeholder="Describe your action…"></textarea>
                    <div class="cheat-mode">
                        <button id="cheat-mode" class="focus-btn focus-btn-capture" type="button" aria-pressed="false" aria-describedby="cheat-mode-help">Cheat Mode <span id="cheat-mode-state" class="capture-background-chat-state" aria-hidden="true">OFF</span></button>
                        <span id="cheat-mode-help" class="cheat-mode-help">Make the requested outcome happen.</span>
                    </div>
                    <div class="interaction-actions">
                        <span class="keyboard-hint">Enter to interact &middot; Esc to close</span>
                        <button id="submit" class="focus-btn focus-btn-primary" type="button">Interact</button>
                    </div>
                </form>
                <p id="status" role="status" aria-live="polite"></p>
                <section id="confirmation" aria-label="Confirm protected action" hidden>
                    <p>Confirm this protected action to continue.</p>
                    <div class="confirmation-actions">
                        <button id="decline" class="focus-btn" type="button">Cancel</button>
                        <button id="approve" class="focus-btn focus-btn-danger" type="button">Confirm action</button>
                    </div>
                </section>
            </div>
        </main>
    </div>
    <script src="ui_scale.js"></script>
    <script src="item_interaction.js"></script>
</body>
</html>
