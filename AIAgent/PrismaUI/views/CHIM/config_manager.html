<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CHIM Settings</title>
    <link rel="stylesheet" href="config_manager.css">
</head>
<body>
    <main class="settings-shell" aria-label="CHIM settings">
        <header class="panel-header">
            <div><h1>Settings</h1><p>Manage CHIM without leaving the game.</p></div>
            <button id="close-button" class="icon-button" type="button" aria-label="Close">&times;</button>
        </header>
        <nav class="top-tabs" aria-label="Settings pages">
            <button class="top-tab active" data-page="globals" type="button">🌐 Global Settings</button>
            <button class="top-tab" data-page="profiles" type="button">📁 Profiles</button>
            <button class="top-tab" data-page="npcs" type="button">🧑 CHIM NPCs</button>
        </nav>
        <div id="status-line" class="status-line">Loading settings...</div>

        <section id="globals-page" class="page active">
            <div id="global-tabs" class="sub-tabs"></div>
            <form id="globals-form">
                <div id="global-sections" class="settings-grid"></div>
                <section class="settings-section context-options-section">
                    <h2>🧩 Prompt Context Selections</h2>
                    <div id="prompt-context-options" class="context-options-grid"></div>
                </section>
                <footer class="action-bar"><button class="button primary" type="submit">Save Global Settings</button></footer>
            </form>
        </section>

        <section id="profiles-page" class="page" hidden>
            <div class="profiles-layout">
                <aside class="profile-sidebar">
                    <div class="sidebar-actions">
                        <button id="new-profile" class="button primary" type="button">New</button>
                        <button id="delete-profile" class="button danger" type="button">Delete</button>
                    </div>
                    <div id="profile-list" class="profile-list"></div>
                </aside>
                <form id="profile-form" class="profile-editor">
                    <section class="settings-section">
                        <h2>⚙ Profile Core</h2>
                        <div class="field-grid two-column">
                            <label class="field"><span>Name</span><input name="label" required></label>
                            <label class="field"><span>Slot</span><select name="slot"><option value="">No slot</option><option>1</option><option>2</option><option>3</option><option>4</option></select></label>
                        </div>
                        <label class="toggle-field"><input name="default_npc" type="checkbox"><span>Default NPC Profile</span></label>
                        <label class="field"><span>Prompt</span><textarea name="prompt" rows="7"></textarea></label>
                    </section>
                    <div id="profile-connectors" class="settings-grid"></div>
                    <div id="profile-metadata-sections" class="settings-grid"></div>
                    <section class="settings-section profile-overrides">
                        <h2>🌐 Global Settings Overrides</h2>
                        <p>Enable only the settings this profile should override.</p>
                        <div id="profile-override-sections" class="settings-grid"></div>
                    </section>
                    <details class="settings-section advanced-metadata">
                        <summary>Advanced Metadata JSON</summary>
                        <p>Unknown plugin metadata is preserved. Edit only when needed.</p>
                        <textarea id="profile-metadata-json" rows="12" spellcheck="false"></textarea>
                    </details>
                    <footer class="action-bar"><button class="button primary" type="submit">Save Profile</button></footer>
                </form>
            </div>
        </section>
    </main>
    <script src="config_manager.js"></script>
</body>
</html>
